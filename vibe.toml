[package]
name = "opencode"
group = "org.vibevm.opencode"
kind = "app"
version = "0.0.1"
epoch = 1
template = true
format = "normal"
authors = ["Oleg Chirukhin"]
license = "MIT"
description = "OpenCode {version}, the official standalone upstream build — one self-contained binary — as a portable Vibe application putting opencode on PATH"
keywords = ["opencode", "agent", "coding-agent", "cli", "application"]
homepage = "https://github.com/anomalyco/opencode"

[compatibility]
min_vibe_version = "1.0.12"
requires_kinds = []

[application]
id = "opencode"
keywords = ["opencode", "agent", "coding-agent"]

# `[package].version` above is the template REVISION, not an OpenCode version,
# and it is deliberately numbered below every version this template produces
# (`0.0.1` < `2.2.0`): rendering a template fetched from a per-package Git
# registry is not wired yet (PROP-075 `#P2-AS-BUILT` (8)), so a client that
# resolves this repository by its tag list must prefer a concretely published
# version over this manifest, which it would otherwise install with its
# `{version}` placeholders unsubstituted. `README.md` says how the two tags
# divide the work.
#
# The version domain: the `vX.Y.Z` releases of the upstream repository that
# publish the twelve CLI archives, listed one row per version. The 2.x line
# only — 1.x is a different major with its own asset set and is not packaged
# here.
#
# `kind = "list"` and not `kind = "json"` over the GitHub releases API,
# deliberately and for one measured reason: `[template.versions].url` must be a
# credential-free HTTPS URL with **no query string** (the manifest validator
# refuses `?`), so the only reachable document is
# `https://api.github.com/repos/anomalyco/opencode/releases` with its default
# page size of 30. That repository releases three things from one tag space
# (`vX.Y.Z` for the CLI and the desktop app together, `process-daemon-vX.Y.Z`
# for a separate daemon, and `pr-*` preview tags), and a selector cannot
# filter: measured on 2026-11-11 the default page held 30 releases — 26
# `vX.Y.Z`, of which only **8** were 2.x, the rest 1.18/1.19 — in 2.07 MB of
# JSON per resolution, spanning 74 days. A JSON domain would therefore drop
# each version — including a version pinned in a corporate drop — about two
# months after its release, and would offer the 1.x line this package does not
# cover. A listed domain keeps every version installable for good; the price is
# one row per upstream release, and no digest is ever transcribed by hand
# because they still come from upstream's own `SHA256SUMS`.
#
# Adding a version: append one row, run `vibe app versions
# org.vibevm.opencode/opencode`, and bump `[package].version` (the template
# revision). Rows are kept newest last.
[template.versions]
kind = "list"

[[template.versions.item]]
version = "2.2.0"

[[template.versions.item]]
version = "2.2.1"

[[template.versions.item]]
version = "2.2.2"

[[template.versions.item]]
version = "2.2.3"

[[template.versions.item]]
version = "2.2.4"

[[template.versions.item]]
version = "2.2.5"

[[template.versions.item]]
version = "2.2.6"

[[template.versions.item]]
version = "2.2.7"

# One `SHA256SUMS` per release, in `sha256sum(1)` form, naming every archive of
# that release — the CLI archives this package installs and the desktop
# installers it does not. It carries no sizes, so no option declares `size` and
# the step panel falls back to the server's `Content-Length`.
[template.digests]
kind = "sha256sums"
url = "https://github.com/anomalyco/opencode/releases/download/v{version}/SHA256SUMS"

# The twelve installer options are one per CLI archive of a release. The
# `baseline` archives — upstream's builds for x86-64 CPUs without AVX2 — carry
# a platform id of their own (`linux-baseline`, `linux-musl-baseline`,
# `macos-baseline`, `windows-baseline`) rather than a second option on
# `linux` / `macos` / `windows`. That is what keeps them selectable but never
# selected: `detected_platform()` only ever answers `linux`, `macos` or
# `windows` (PROP-059 `#installer-options`), so a baseline row never matches a
# host and a plain `vibe install -g org.vibevm.opencode/opencode` is never
# ambiguous. Two rows on one platform/arch pair would instead make every
# unattended install refuse with `--installer selection required`. A CPU
# without AVX2 is asked for by name:
# `vibe install -g org.vibevm.opencode/opencode --platform linux-baseline`.
# The musl rows follow the same precedent as `org.vibevm.codkit/codkit`'s
# `linux-musl-x64`.


[[installer_options]]
id = "linux-x64"
name = "OpenCode {version}"
platform = "linux"
platform_name = "Linux (glibc)"
arch = "x86_64"
arch_name = "Intel/AMD 64-bit"

[[installer_options.steps]]
id = "opencode"
title = "Download and unpack the standalone OpenCode {version} binary"
kind = "archive"
format = "tar_gz"
source = "https://github.com/anomalyco/opencode/releases/download/v{version}/opencode-linux-x64.tar.gz"
sha256 = "{sha256:opencode-linux-x64.tar.gz}"

[[installer_options.launchers]]
id = "opencode"
name = "opencode"
description = "The OpenCode command line (one self-contained binary, no runtime on PATH)"
executable = "opencode"
kind = "command"
default = true

[[installer_options.public_commands]]
name = "opencode"
launcher = "opencode"


