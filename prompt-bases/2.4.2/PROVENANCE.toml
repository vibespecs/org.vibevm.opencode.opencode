# ---------------------------------------------------------------------------
# The render rule: how `${OPENCODE_TOOL_GUIDANCE}` is expanded. The token is
# replaced with the bullets whose `gate` tool is present in the launch's tool
# list, joined by a single newline, in the order written here — upstream's
# source order, independent of the tool list's order. Only the FIRST
# occurrence of the token is replaced. A base whose text lacks the token is
# left untouched, which is why kimi/meta/trinity models receive no tool
# bullets at all.
# Recorded from: packages/core/src/session/system-prompt.ts:9-27 (file sha256
# 88f088f1bfa0b5e7dabfb6d3083c19d4203f7e12cc00a251494264a5b243f1dd).
# ---------------------------------------------------------------------------

[render]
token = "${OPENCODE_TOOL_GUIDANCE}"
replace = "first"
join = "\n"
source = "packages/core/src/session/system-prompt.ts:9-27"
# The program emits its own base with trailing whitespace removed, and that
# is one byte here: `system.txt` ends with a newline, the rendered text is
# therefore 1,471 bytes, and the installed 2.2.7 binary's own first system
# part is **1,470**. Recorded rather than left to the reader because it
# moves the seam — a composition that kept the newline would put three of
# them between the base's last sentence and the lane's first marker, where a
# plain run has two, and the whole-request diff below would then see the
# difference inside the insertion instead of beside it. Accepted values:
# `none` (nothing is trimmed) and `end`.
trim = "end"

[[render.bullet]]
gate = "shell"
text = "- Prefer dedicated tools over shell commands; fall back to the shell when a tool cannot do what you need."

[[render.bullet]]
gate = "shell"
text = "- Do not chain shell commands with separators like `echo \"====\";` or `printf '---'`; the output becomes noisy in a way that makes the user's side of the conversation worse."

[[render.bullet]]
gate = "write"
text = "- Use the write tool to create files or completely replace their content. Prefer using the edit tool for targeted changes."

[[render.bullet]]
gate = "edit"
text = "- Use the edit tool for targeted changes to existing text files. It replaces the exact text in `oldString` with `newString`, and the values must differ. By default, `oldString` must occur exactly once. If it occurs multiple times, include more surrounding context to make it unique or set `replaceAll` to true to replace every occurrence."

# ---------------------------------------------------------------------------
# How the lane is handed over, and the one transformation it undergoes.
# ---------------------------------------------------------------------------

[carrier]
kind = "config-agent-system"
# One per-launch configuration document in this environment variable;
# `{file:}` is substituted inside `agents.<name>.system`
# (packages/core/src/config.ts:293,
# packages/core/src/config/variable.ts:47-76). Measured on 2.2.7 against a
# fixture holding `"`, `\`, `{}` and `${}`: the inserted text arrives in the
# parsed value verbatim, so an arbitrary lane cannot break the document.
env = "OPENCODE_CONFIG_CONTENT"
# **One flag, and it is not optional.** OpenCode's default mode serves
# sessions from one long-lived background service that never sees this
# launch's environment, so without `--standalone` the document either does
# not arrive at all or arrives for every session that service goes on to
# serve.
#
# `--agent` is deliberately NOT here. It is a flag of the `run` and `mini`
# subcommands only: measured on 2.2.7, `opencode --standalone --agent <name>`
# prints the usage and starts nothing, so a launcher that must also start
# the interactive interface cannot select the agent with it. The document's
# own `default_agent` key does select it, for the TUI and for every
# subcommand alike — verified at the request level, where the agent's
# `system` arrived as the first system part with no `--agent` anywhere.
flags = ["--standalone"]
# The document's own key names, so vibe's Rust spells no configuration key
# of another program (packages/schema/src/config.ts for the two root keys,
# packages/schema/src/config/agent.ts for the agent's).
agents_key = "agents"
system_key = "system"
mode_key = "mode"
default_agent_key = "default_agent"
# The agent vibe declares and selects. A user agent of the same name is
# shadowed for this launch alone, because the document is one configuration
# layer in one process's environment and is never written to disk.
agent_name = "vibe"
agent_mode = "primary"
# The gate tool names a launch through this carrier offers, which is what
# the `[render]` bullets above are gated on. The agent is declared `primary`
# with no tool restriction of its own — the agent schema has no `tools` key
# at all (packages/schema/src/config/agent.ts) — so the launch receives
# OpenCode's default tool set, and these three are in it. Recorded as data
# because the render rule needs it and the launch cannot ask; proved by the
# whole-request diff below rather than assumed.
gate_tools = ["shell", "write", "edit"]
lane_token = "{file:%LANE%}"
# `{file:}` TRIMS leading and trailing whitespace from the inserted content
# and keeps inner newlines (measured on a fixture). The lane's first byte is
# `<`, so nothing is lost at the head; at the tail exactly one newline is
# dropped — 202,348 of a 202,349-byte lane in the measurement below — and both
# marker lines and their ids arrive intact.
lane_transform = "trim"
lane_bytes_dropped_at_tail = 1
separator_between_base_and_lane = "\n\n"

