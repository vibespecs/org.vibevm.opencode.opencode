# ---------------------------------------------------------------------------
# Selection: which base a model gets. Matching is a SUBSTRING test against the
# model id lower-cased — not the provider id, not the model's family — and the
# rows are tried in the order given, which is upstream's registration order.
# The first row whose `substring` is present wins; `mode = "append"` keeps the
# default base and appends this one behind a blank line, `mode = "override"`
# replaces it. A model matching no row takes the `default = true` base.
# Recorded from: packages/core/src/plugin/optimize.ts:16-62 (file sha256
# b86696d0dcfc157fdba58763190903bd78b5a15ead54d7dd2da208f6fe569a67).
# ---------------------------------------------------------------------------

[[select]]
# Upstream's one OpenAI predicate answers `id.includes("astra") ? ASTRA : GPT`
# for any id containing "gpt", so the astra row is written first and
# first-match-wins reproduces it. `substrings` must ALL be present.
substrings = ["gpt", "astra"]
base = "gpt-astra"
mode = "override"
source = "packages/core/src/plugin/optimize.ts:16-20"

[[select]]
substrings = ["gpt"]
base = "gpt"
mode = "override"
source = "packages/core/src/plugin/optimize.ts:16-20"

[[select]]
substrings = ["claude"]
base = "anthropic"
mode = "append"
source = "packages/core/src/plugin/optimize.ts:22-30"

[[select]]
substrings = ["kimi"]
base = "kimi"
mode = "override"
source = "packages/core/src/plugin/optimize.ts:51-53"

[[select]]
substrings = ["trinity"]
base = "trinity"
mode = "override"
source = "packages/core/src/plugin/optimize.ts:54-56"

[[select]]
substrings = ["muse"]
base = "meta"
mode = "override"
source = "packages/core/src/plugin/optimize.ts:57-60"
# `{{MODEL_NAME}}` is replaced with the model's display name, every
# occurrence. One occurrence exists, on line 1 of meta.txt.
[[select.substitute]]
token = "{{MODEL_NAME}}"
value = "model_name"
occurrences = "all"

# ---------------------------------------------------------------------------
# The render rule: how `${OPENCODE_TOOL_GUIDANCE}` is expanded. The token is
# replaced with the bullets whose `gate` tool is present in the launch's tool
# list, joined by a single newline, in the order written here — upstream's
# source order, independent of the tool list's order. Only the FIRST
# occurrence of the token is replaced. A base whose text lacks the token is
# left untouched, which is why kimi/meta/trinity models receive no tool
# bullets at all.
# Recorded from: packages/core/src/session/system-prompt.ts:9-27 (file sha256
# 88f088f1bfa0b5e7dabfb6d3083c19d4203f7e12cc00a251494264a5b243f1dd).
# ---------------------------------------------------------------------------

[render]
token = "${OPENCODE_TOOL_GUIDANCE}"
replace = "first"
join = "\n"
source = "packages/core/src/session/system-prompt.ts:9-27"

[[render.bullet]]
gate = "shell"
text = "- Prefer dedicated tools over shell commands; fall back to the shell when a tool cannot do what you need."

[[render.bullet]]
gate = "shell"
text = "- Do not chain shell commands with separators like `echo \"====\";` or `printf '---'`; the output becomes noisy in a way that makes the user's side of the conversation worse."

[[render.bullet]]
gate = "write"
text = "- Use the write tool to create files or completely replace their content. Prefer using the edit tool for targeted changes."

[[render.bullet]]
gate = "edit"
text = "- Use the edit tool for targeted changes to existing text files. It replaces the exact text in `oldString` with `newString`, and the values must differ. By default, `oldString` must occur exactly once. If it occurs multiple times, include more surrounding context to make it unique or set `replaceAll` to true to replace every occurrence."

# ---------------------------------------------------------------------------
# How the lane is handed over, and the one transformation it undergoes.
# ---------------------------------------------------------------------------

[carrier]
kind = "config-agent-system"
# One per-launch configuration document in this environment variable; it is
# substituted as TEXT before the JSONC is parsed, so `{file:}` works inside
# `agents.<name>.system` (packages/core/src/config.ts:293,
# packages/core/src/config/variable.ts:47-76).
env = "OPENCODE_CONFIG_CONTENT"
# Required: OpenCode's default mode serves sessions from one long-lived
# background service that never sees this launch's environment.
flags = ["--standalone", "--agent"]
agent_mode = "primary"
lane_token = "{file:%LANE%}"
# `{file:}` TRIMS leading and trailing whitespace from the inserted content
# and keeps inner newlines (measured on a fixture). The lane's first byte is
# `<`, so nothing is lost at the head; at the tail exactly one newline is
# dropped — 202,348 of a 202,349-byte lane in the measurement below — and both
# marker lines and their ids arrive intact.
lane_transform = "trim"
lane_bytes_dropped_at_tail = 1
separator_between_base_and_lane = "\n\n"

