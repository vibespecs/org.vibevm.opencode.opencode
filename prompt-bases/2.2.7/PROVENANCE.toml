# Where OpenCode 2.2.7's own system-prompt bases came from, how they compose,
# and what has actually been proved about them.
#
# This file is DATA, read by a generic interpreter in vibe. No prompt text, no
# token spelling, no bullet string and no model-matching rule may be a literal
# in vibe's Rust: a version whose composition needs a rule the interpreter
# cannot express is REFUSED, never approximated, and the launch then falls back
# to the soft launch of `PROP-076#SYS-SOFT-LAUNCH`.
#
# Why this exists at all: vibe delivers a project's boot lane in the agent's
# own system prompt, and OpenCode's only subagent-safe slot — an agent's
# `system` — *replaces* the base prompt rather than adding to it. So vibe must
# supply OpenCode's own base, for exactly the installed version, with the lane
# after it. See `PROP-076#SYS-SUPPLIED-BASE` and
# `campaigns/sys-prompt-2026-11/HARNESS-DELIVERY.md` §5 ("OpenCode, second
# look") in the vibevm repository, and the "Maintaining" section of this
# package's README for the runbook that produced this directory.

schema = 1
harness = "opencode"
harness_version = "2.2.7"

[upstream]
repository = "https://github.com/anomalyco/opencode"
# `github.com/sst/opencode` 301-redirects here.
tag = "v2.2.7"
commit = "fedc6f208aa2bd54c1019227214568083f6380ad"
read_from = "source tarball of that commit"
read_on = "2026-11-11"

# The licence that governs every byte in this directory except this file.
# Carried verbatim beside the text it governs, which is what MIT asks for:
# "The above copyright notice and this permission notice shall be included in
# all copies or substantial portions of the Software."
[upstream.license]
spdx = "MIT"
copyright = "Copyright (c) 2025 opencode"
upstream_path = "LICENSE"
file = "LICENSE"
bytes = 1065
sha256 = "625f0f619133f89bbbb2abe37369613dfa1885eba1e50d02170deb62bb42cb6b"
# No `SPDX-License-Identifier` string anywhere in the file; no per-file licence
# header on any base file; `packages/core/` carries no LICENSE or NOTICE of its
# own and is covered by this root MIT through `packages/core/package.json`.
notice = "none"

