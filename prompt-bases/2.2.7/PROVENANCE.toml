# Verification. `verified` is earned by a WHOLE-REQUEST measurement against
# the installed program, never by the digests above.
# ---------------------------------------------------------------------------

[verification]
verified = false
# Why not yet: conditions (iv), (v-diff) and (vi) of
# `PROP-076#SYS-SUPPLIED-BASE` have not been run, and vibe's reader, launch
# path and sync tool do not exist yet. Until `verified = true`, a launch must
# soft-launch rather than deliver.
proof_id = ""
proof_date = ""
model_used = "fake-1 (loopback recorder), offline"
lane_bytes = 202349

# What HAS been measured, 2026-11-11, offline against a loopback
# OpenAI-compatible recorder, on the campaign's padded sample project.
[verification.measured]
# (0) The reproduction equals the installed program's own base.
base_reproduced_bytes = 1470
base_reproduced_sha256_prefix = "3728fd87457f4314"
base_equals_installed_output = true
# (i) One contiguous insertion and nothing else.
insertion_offset = 1472
insertion_bytes = 202348
plain_bytes_in_that_window = 0
other_members_identical = true
# `model`, `stream`, `tools`, `max_completion_tokens`, `stream_options` and
# every non-system message compared equal.
# (ii) The inserted bytes.
inserted_equals_lane_minus_trailing_newline = true
markers_intact = true
# (iii) The seam, in both directions.
seam_before = "…investigate before deleting or overwriting them.\n\n"
seam_after = "\n# Your Model"
# (v) Worker exclusion, by measurement rather than by a source read.
subagent_lane_occurrences = 0
subagent_system_bytes = 10952
# Still to run: (iv) two consecutive launches byte-identical up to the end of
# the lane; (v) a diff of the child request against its own plain counterpart;
# (vi) live, that an instruction existing only in this base is still obeyed.
pending = ["two-launch-stability", "subagent-whole-request-diff", "live-base-not-displaced"]

# ---------------------------------------------------------------------------
# Two caveats. They are here rather than in a commit message because a reader
# who does not know them would over-trust this file.
# ---------------------------------------------------------------------------

[[caveat]]
id = "tag-versus-bundle"
text = """
Every digest above is of the file as it exists in the upstream git commit, not
in the published artifact. OpenCode ships one compiled binary that inlines
these .txt files through its bundler, so no digest here can attest that the
program on disk carries the tag's bytes. The ONLY evidence for that is the
capture in `[verification]`: the base reproduced from this data was
byte-identical to what the installed 2.2.7 binary put in its own first system
part. That is why `verified` is a measurement per version and not a checksum.
"""

[[caveat]]
id = "plugins-can-add-parts"
text = """
This file describes the composition of an UNEXTENDED install. An OpenCode
plugin can mutate the system array through the same `session.context` hook the
built-in ones use, and no fingerprint of OpenCode's core will catch that. A
launch in a project or home that loads such a plugin may therefore compose a
prompt this record does not describe.
"""
